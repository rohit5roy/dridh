[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "dridh"
# The version lives only in src/dridh/__init__.py (__version__); everything else reads it from there.
dynamic = ["version"]
description = "Dridh: a document-driven feature harness for OpenCode"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Roy" }]
keywords = ["dridh", "opencode", "harness"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic==2.14.3",
  "typer==0.27.3",
  "pyyaml==6.0.2",
  # Code Reacher (Phase 14). Versions proven in the Phase 0 spike (D-P0-08); imported lazily, never at CLI start-up.
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-java==0.23.5",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-javascript==0.25.0",
  "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
# Local embedding model (decision D-15). Large (ONNX Runtime + model download), so optional: without it Code
# Reacher uses a deterministic hashing embedder and reports itself as degraded.
embeddings = ["fastembed==0.9.1"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.12.11",
]

[project.scripts]
dridh = "dridh.cli.main:main"

[tool.hatch.version]
path = "src/dridh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dridh"]
# Generated by scripts/build_assets.py; ignored by Git but required in the wheel.
artifacts = ["src/dridh/assets/**"]

# Stops a wheel build that would ship without the plugin (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/dridh", "tests", "opencode", "scripts/build_assets.py", "hatch_build.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: Category B - live OpenCode model execution; needs DRIDH_REAL_OPENCODE=1, a configured credential and a disposable configuration. Never enabled in ordinary CI.",
  "opencode: needs the pinned OpenCode CLI named by DRIDH_OPENCODE_BIN. Hermetic (temporary HOME); runs in CI.",
  "containers: needs a running Docker daemon (story tests in containers); skipped when Docker is not available.",
  "docker: Category C - Docker full-system E2E; runs through tests/e2e/run_docker_e2e.py, not pytest.",
  "local_only: Category C - inspects the developer's real OpenCode configuration. Opt-in with DRIDH_CHECK_REAL_OPENCODE_CONFIG=1; never runs in CI.",
  "asyncio: marks tests as async (deselect with -k \"not asyncio\").",
]

[tool.ruff]
line-length = 180
target-version = "py313"
extend-exclude = ["opencode", "spikes", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "W"]
ignore = ["UP007", "UP045"]
